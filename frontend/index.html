<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Research Opportunity Portal</h2>
    <button class="btn btn-primary" onclick="openForm()">+ New Opportunity</button>
  </div>
  <div id="message"></div>
  <div id="list" class="row g-3"></div>
</div>

<!-- Details window -->
<div class="modal fade" id="detailsModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Opportunity Details</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="detailsBody"></div>
  </div></div>
</div>

<!-- Create / Edit window -->
<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <form id="oppForm" novalidate>
      <div class="modal-header"><h5 class="modal-title" id="formTitle">New Opportunity</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-2"><label class="form-label">Title</label>
          <input class="form-control" id="title" required></div>
        <div class="mb-2"><label class="form-label">Description</label>
          <textarea class="form-control" id="description" rows="3" required></textarea></div>
        <div class="mb-2"><label class="form-label">Research Area</label>
          <input class="form-control" id="research_area" required></div>
        <div class="mb-2"><label class="form-label">Faculty Member Name</label>
          <input class="form-control" id="faculty_name" required></div>
        <div class="mb-2"><label class="form-label">Department</label>
          <input class="form-control" id="department" required></div>
        <div class="mb-2"><label class="form-label">Required Skills</label>
          <input class="form-control" id="required_skills" required></div>
        <div class="mb-2"><label class="form-label">Available Positions</label>
          <input type="number" min="1" class="form-control" id="positions" required></div>
        <div class="mb-2"><label class="form-label">Application Deadline</label>
          <input type="date" class="form-control" id="deadline" required></div>
        <div class="mb-2"><label class="form-label">Status</label>
          <select class="form-select" id="status">
            <option value="Open">Open</option>
            <option value="Closed">Closed</option>
          </select></div>
        <div class="invalid-feedback d-block" id="formError"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '/api/opportunities';
const FIELDS = ['title', 'description', 'research_area', 'faculty_name',
                'department', 'required_skills', 'positions', 'deadline', 'status'];
let editingId = null;
const detailsModal = new bootstrap.Modal(document.getElementById('detailsModal'));
const formModal = new bootstrap.Modal(document.getElementById('formModal'));

// Makes text safe to show on the page
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function showMessage(text, type = 'success') {
  document.getElementById('message').innerHTML =
    `<div class="alert alert-${type} alert-dismissible fade show">${esc(text)}
     <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
}

// Sends a request to the backend and returns the answer
async function request(url, options) {
  const res = await fetch(url, options);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

// Show all opportunities
async function loadList() {
  try {
    const items = await request(API);
    const list = document.getElementById('list');
    if (items.length === 0) {
      list.innerHTML = '<p class="text-muted">No opportunities yet. Click "New Opportunity".</p>';
      return;
    }
    list.innerHTML = items.map(o => `
      <div class="col-md-6"><div class="card h-100"><div class="card-body">
        <div class="d-flex justify-content-between">
          <h5 class="card-title">${esc(o.title)}</h5>
          <span class="badge ${o.status === 'Open' ? 'bg-success' : 'bg-secondary'}">${esc(o.status)}</span>
        </div>
        <p class="mb-1"><b>Area:</b> ${esc(o.research_area)}</p>
        <p class="mb-1"><b>Faculty:</b> ${esc(o.faculty_name)} (${esc(o.department)})</p>
        <p class="mb-1"><b>Positions:</b> ${esc(o.positions)} &nbsp; <b>Deadline:</b> ${esc(o.deadline)}</p>
        <div class="mt-3 d-flex flex-wrap gap-2">
          <button class="btn btn-sm btn-info" onclick="viewDetails(${o.id})">Details</button>
          <button class="btn btn-sm btn-warning" onclick="openForm(${o.id})">Edit</button>
          ${o.status === 'Open'
            ? `<button class="btn btn-sm btn-secondary" onclick="closeOpp(${o.id})">Close</button>` : ''}
          <button class="btn btn-sm btn-danger" onclick="deleteOpp(${o.id})">Delete</button>
        </div>
      </div></div></div>`).join('');
  } catch (e) {
    showMessage(e.message, 'danger');
  }
}

// Show full details of one opportunity
async function viewDetails(id) {
  try {
    const o = await request(API + '/' + id);
    document.getElementById('detailsBody').innerHTML = `
      <h5>${esc(o.title)}</h5>
      <p>${esc(o.description)}</p>
      <p><b>Research Area:</b> ${esc(o.research_area)}</p>
      <p><b>Faculty:</b> ${esc(o.faculty_name)}</p>
      <p><b>Department:</b> ${esc(o.department)}</p>
      <p><b>Required Skills:</b> ${esc(o.required_skills)}</p>
      <p><b>Positions:</b> ${esc(o.positions)}</p>
      <p><b>Deadline:</b> ${esc(o.deadline)}</p>
      <p><b>Status:</b> ${esc(o.status)}</p>`;
    detailsModal.show();
  } catch (e) {
    showMessage(e.message, 'danger');
    loadList();
  }
}

// Open the form (empty for new, filled for edit)
async function openForm(id) {
  document.getElementById('formError').textContent = '';
  document.getElementById('oppForm').classList.remove('was-validated');
  document.getElementById('oppForm').reset();
  editingId = id || null;
  document.getElementById('formTitle').textContent = id ? 'Edit Opportunity' : 'New Opportunity';
  if (id) {
    try {
      const o = await request(API + '/' + id);
      FIELDS.forEach(f => document.getElementById(f).value = o[f]);
    } catch (e) {
      showMessage(e.message, 'danger');
      loadList();
      return;
    }
  }
  formModal.show();
}

// Save (create or update)
document.getElementById('oppForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const form = ev.target;
  if (!form.checkValidity()) {
    form.classList.add('was-validated');
    document.getElementById('formError').textContent = 'Please fill in all required fields correctly.';
    return;
  }
  const body = {};
  FIELDS.forEach(f => body[f] = document.getElementById(f).value.trim());
  try {
    await request(editingId ? API + '/' + editingId : API, {
      method: editingId ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    formModal.hide();
    showMessage(editingId ? 'Opportunity updated successfully.' : 'Opportunity created successfully.');
    loadList();
  } catch (e) {
    document.getElementById('formError').textContent = e.message;
  }
});

// Change status from Open to Closed
async function closeOpp(id) {
  try {
    await request(API + '/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'Closed' })
    });
    showMessage('Opportunity closed.');
  } catch (e) {
    showMessage(e.message, 'danger');
  }
  loadList();
}

// Delete
async function deleteOpp(id) {
  if (!confirm('Are you sure you want to delete this opportunity?')) return;
  try {
    await request(API + '/' + id, { method: 'DELETE' });
    showMessage('Opportunity deleted.');
  } catch (e) {
    showMessage(e.message, 'danger');
  }
  loadList();
}

loadList();
</script>
</body>
</html>
